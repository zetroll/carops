# incubator-ops — Canonical Pipeline States
#
# Source of truth for status field in data/incubators.md.
# Status MUST be exactly one of these labels (case-insensitive).
# No markdown bold, no dates, no extra text. Dates go in their own columns.

states:
  - id: discovered
    label: Discovered
    description: URL added to pipeline; not yet evaluated

  - id: evaluated
    label: Evaluated
    description: A-F brief written; pending decision to apply

  - id: drafted
    label: Drafted
    description: Application packet drafted; founder reviewing before submit

  - id: applied
    label: Applied
    description: Application submitted to incubator

  - id: acknowledged
    label: Acknowledged
    description: Confirmation receipt from incubator

  - id: screening
    label: Screening
    description: Under initial review (typically a screening committee)

  - id: ic-pending
    label: IC-Pending
    description: Queued for next Investment / Selection Committee meeting

  - id: ic-scheduled
    label: IC-Scheduled
    description: IC date set; pitch prep underway

  - id: pitched
    label: Pitched
    description: Presented to IC; awaiting decision

  - id: selected
    label: Selected
    description: Accepted into the program

  - id: rejected
    label: Rejected
    description: Rejected by incubator (start cooldown clock in data/reapply-log.md)

  - id: waitlisted
    label: Waitlisted
    description: Not in this cohort; held for next

  - id: reapply-pending
    label: Reapply-Pending
    description: Cooldown active; reapply scheduled in reports/intake-calendar.md

  - id: withdrawn
    label: Withdrawn
    description: Founder pulled out (program turned out to be poor fit, equity-heavy, etc.)

  - id: skip
    label: SKIP
    description: Evaluated but doesn't meet capital policy or sector fit; no application

dashboard_groups:
  active: [evaluated, drafted, applied, acknowledged, screening, ic-pending, ic-scheduled, pitched]
  closed-won: [selected]
  closed-lost: [rejected, withdrawn, waitlisted]
  pending: [discovered, reapply-pending]
  skipped: [skip]
