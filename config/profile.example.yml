# incubator-ops Profile Configuration
# Copy this file to config/profile.yml and fill in.
# config/profile.yml is gitignored; commit only this example.

founder:
  full_name: "__FILL__"
  email: "__FILL__"
  phone: "__FILL__"
  linkedin: "__FILL__"
  twitter: "__FILL__"
  location:
    city: "__FILL__"
    state: "__FILL__"
    country: "India"
  relocation_tolerance: "exceptional-only"   # never | exceptional-only | flexible | anywhere

startup:
  legal_name: "__FILL__"     # e.g. "ThoughtKraft AI Partners LLP"
  brand_name: "__FILL__"     # e.g. "ThoughtKraft"
  product_name: "__FILL__"   # e.g. "Kraft"
  website: "__FILL__"
  form: "LLP"                # LLP | Pvt Ltd | Partnership | etc.
  incorporation_date: "__FILL__"   # YYYY-MM-DD — critical for SISFS ≤2-yr eligibility
  dpiit_recognized: true
  dpiit_certificate_no: "__FILL__"

capital_policy:
  format_preference: "grants"     # grants | equity | mixed
  equity_max_pct: 3
  equity_min_cheque_inr_lakh: 20  # below this, refuse equity entirely
  series_a_target_inr_cr: 4       # for "defer to Series A" decision points

team:
  co_founders: 0
  full_time_employees: 1
  advisors_with_equity:
    - name: "__FILL__"
      pct: 1
      role: "Advisor"

network_vectors:
  # See modes/_profile.md for how these are used in outreach.
  - name: "__FILL__"
    relationship: "__FILL__"
    reach_to: ["__FILL__: which IC member or program"]

agent_behavior:
  # When unsure, refuse rather than guess.
  refuse_on_metric_invention: true
  refuse_on_logo_inflation: true
  never_submit_applications: true
